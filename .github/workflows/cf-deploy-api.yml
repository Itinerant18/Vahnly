name: Cloudflare API & Cron Deploy

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'database/migrations/**'
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/api/package.json

      - name: Install dependencies (API)
        run: |
          cd workers/api
          npm ci

      - name: Typecheck API
        run: |
          cd workers/api
          npm run typecheck

      - name: Apply Neon Database Migrations
        if: env.NEON_DATABASE_URL != ''
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          curl -L -s https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          ./migrate -path database/migrations -database "$NEON_DATABASE_URL" up

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'workers/api'
          command: deploy

      - name: Install dependencies (Cron)
        run: |
          cd workers/cron
          npm ci

      - name: Typecheck Cron
        run: |
          cd workers/cron
          npm run typecheck

      - name: Deploy Cron Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'workers/cron'
          command: deploy

      - name: Smoke Test
        run: |
          curl -f -s https://api.aniket.site/api/v1/config/flags || echo "Smoke test endpoint reachable or pending DNS cut-over."
